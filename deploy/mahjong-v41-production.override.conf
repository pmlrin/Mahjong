# Use after the stopped backup and production-copy migration checks.
[Service]
WorkingDirectory=/opt/mahjong/current
EnvironmentFile=/opt/mahjong/v3-production-auth.env
EnvironmentFile=/opt/mahjong/v41-production-runtime.env
ReadWritePaths=
ReadWritePaths=/opt/mahjong/releases/20261102-v41-production-rc2 /opt/mahjong/mail-budget
ExecStart=
ExecStart=/opt/mahjong/runtime/bin/node --max-old-space-size=112 dist-server/backend/src/server.js
MemoryHigh=256M
MemoryMax=320M
CPUQuota=150%
