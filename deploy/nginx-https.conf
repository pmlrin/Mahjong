server {
    listen 443 ssl http2;
    server_name mahjong.yangjm.cn;
    ssl_certificate /etc/letsencrypt/live/mahjong.yangjm.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahjong.yangjm.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    access_log /var/log/nginx/mahjong.access.log;
    error_log /var/log/nginx/mahjong.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:8029;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location ~ /\. { deny all; }
}
