# Install as mahjong-v2-preview.service.d/v3-20261101.conf after backup/migration checks.
[Unit]
Description=Mahjong V3 isolated preview
[Service]
WorkingDirectory=/opt/mahjong/releases/20261101-v3-preview-rc5
EnvironmentFile=/opt/mahjong/v3-preview-auth.env
EnvironmentFile=/opt/mahjong/v3-preview-runtime.env
ReadWritePaths=
ReadWritePaths=/opt/mahjong/releases/20261101-v3-preview-rc5 /opt/mahjong/mail-budget
ExecStart=
ExecStart=/opt/mahjong/runtime/bin/node --max-old-space-size=112 dist-server/backend/src/server.js
MemoryHigh=256M
MemoryMax=320M
CPUQuota=150%
