name: mahjong
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mahjong:20261029-v1
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://mahjong:${POSTGRES_PASSWORD}@db:5432/mahjong
      PUBLIC_ORIGIN: https://mahjong.yangjm.cn
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "127.0.0.1:8029:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 320m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: mahjong
      POSTGRES_DB: mahjong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mahjong-data:/var/lib/postgresql/data
    mem_limit: 160m
    shm_size: 64m
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=32MB",
        "-c",
        "max_connections=20",
        "-c",
        "work_mem=2MB",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahjong -d mahjong"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  mahjong-data:
