# Install after the production backup and restored-copy migration checks.
[Service]
EnvironmentFile=/opt/mahjong/v3-production-auth.env
EnvironmentFile=/opt/mahjong/v3-production-runtime.env
ReadWritePaths=/opt/mahjong/releases/20261101-v3-production /opt/mahjong/mail-budget
ExecStart=
ExecStart=/opt/mahjong/runtime/bin/node --max-old-space-size=112 dist-server/backend/src/server.js
MemoryHigh=256M
MemoryMax=320M
CPUQuota=150%
